<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    The brand mark, taken from the website's logo (src/components/ui/
    LogoWide.vue) rather than redrawn: the two mirrored strokes with their
    dots. The wordmark is dropped, because at 32px an app icon cannot carry
    type, and the two halves keep the logo's red/black split.

    This note lives INSIDE <svg> on purpose. GdkPixbuf decides a file's
    format by sniffing its opening bytes, and it never sees a `<svg` that a
    long leading comment has pushed past that window — the file then fails
    to load with "Couldn't recognize the image file format" while rendering
    perfectly in every other tool. Measured: `<svg` at byte 330 failed, at
    byte 39 it loaded.
  -->
  <rect width="128" height="128" rx="28" fill="#f7f5f3"/>
  <g transform="translate(64 62.7) scale(4.0) translate(-10.65 -5.8) translate(-30.049 -474.358)">
    <g fill="#ae002e" transform="scale(-1)">
      <path d="M-31.986-482.68q-.782 0-1.344-.563-.563-.562-.563-1.343 0-.813.563-1.376.562-.562 1.344-.562.812 0 1.375.562.562.563.562 1.344 0 .813-.562 1.375-.563.563-1.375.563zm-2.47 2.688q.407.844.407 1.719 0 .5-.125 1.031-.375 1.438-1.594 2.25l-5.814-11.532h3.845q1.094 2.188 3.281 6.532z"/>
    </g>
    <g fill="#16161a">
      <path d="M49.414 478.203q-.781 0-1.344-.563-.562-.563-.562-1.344 0-.813.562-1.375.563-.563 1.344-.563.813 0 1.375.563.563.562.563 1.344 0 .812-.563 1.375-.562.563-1.375.563zm-2.47 2.687q.407.844.407 1.72 0 .5-.125 1.03-.375 1.439-1.594 2.251l-5.813-11.533h3.844q1.094 2.188 3.282 6.532z"/>
    </g>
  </g>
</svg>
